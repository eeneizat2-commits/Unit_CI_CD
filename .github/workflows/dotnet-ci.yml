
name: .NET CI

on:
  push:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: dotnet publish "Unit_&_CI/Api.csproj" --configuration Release --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-api-build
          path: ./publish
          retention-days: 7

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --verbosity normal

  verify-artifact:
    name: Verify Artifact
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-api-build
          path: ./publish

      - name: Verify published files
        run: |
          test -n "$(find ./publish -type f -print -quit)"
          echo "Artifact downloaded and verified successfully."
